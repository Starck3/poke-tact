# Publica o app no GitHub Pages (https://starck3.github.io/poke-tact/) a cada push no main.
# O site é só a pasta public/ (HTML, JS e JSON estáticos; caminhos relativos e rotas com #/, então funciona no subcaminho).
# Os testes rodam antes: se falharem, a versão no ar continua a anterior.
name: publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
