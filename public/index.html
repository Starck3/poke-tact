<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poke Tact</title>
<style>
  /* ---- tokens (cores, espaço, raio, tipografia) — um lugar só, como num design system */
  :root {
    --bg:#f6f6f8; --surface:#ffffff; --surface-2:#f0f0f4; --fg:#18181c; --muted:#5f5f6b; --line:#e3e3ea; --line-strong:#cfcfd9;
    --accent:#d33b3b; --accent-fg:#ffffff; --link:#2f62cf;
    --ok:#1f7a35; --ok-bg:#e5f4e8; --warn:#8a5a00; --warn-bg:#fdf1d8; --bad:#b3261e; --bad-bg:#fbe6e4; --info:#2f62cf; --info-bg:#e6eefc;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r1:6px; --r2:10px; --r3:14px; --pill:999px;
    --fs-xs:.75rem; --fs-sm:.85rem; --fs-md:1rem; --fs-lg:1.15rem; --fs-xl:1.5rem;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#121216; --surface:#1c1c22; --surface-2:#24242c; --fg:#f1f1f4; --muted:#a3a3b0; --line:#2e2e37; --line-strong:#3d3d48;
    --link:#8fb3ff; --ok:#6fd38a; --ok-bg:#16301e; --warn:#f0c060; --warn-bg:#33280f; --bad:#ff8a80; --bad-bg:#3a1a18; --info:#8fb3ff; --info-bg:#1a2540;
    --shadow:none;
  } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  .team:empty, #oppInfo:empty { display:none; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:var(--s4); }
  a { color:var(--link); }
  :focus-visible { outline:2px solid var(--info); outline-offset:2px; border-radius:var(--r1); }
  h1 { font-size:var(--fs-xl); margin:0 0 var(--s1); letter-spacing:-.01em; }
  h2 { font-size:var(--fs-md); margin:var(--s5) 0 var(--s2); }
  .sub { color:var(--muted); margin:0 0 var(--s4); }
  .meta { color:var(--muted); font-size:var(--fs-sm); }
  .note { font-size:var(--fs-sm); color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:var(--s4); margin-bottom:var(--s4); box-shadow:var(--shadow); }
  label, .label { display:block; font-size:var(--fs-sm); color:var(--muted); margin-bottom:var(--s1); }
  input[type=text], input[type=number], input[type=search], select { width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--r2); background:var(--surface); color:var(--fg); font:inherit; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); }
  .stack > * + * { margin-top:var(--s3); }
  kbd { font:var(--fs-xs) ui-monospace,monospace; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--muted); }

  /* ---- selos (status), tipos e botões */
  .type { display:inline-block; padding:1px 8px; border-radius:var(--pill); font-size:var(--fs-xs); color:#fff; margin-right:4px; text-transform:capitalize; font-weight:600; }
  .lozenge { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); font-weight:600; padding:2px 8px; border-radius:var(--pill); border:1px solid transparent; white-space:nowrap; }
  .lozenge.ok { color:var(--ok); background:var(--ok-bg); } .lozenge.warn { color:var(--warn); background:var(--warn-bg); }
  .lozenge.bad { color:var(--bad); background:var(--bad-bg); } .lozenge.info { color:var(--info); background:var(--info-bg); }
  .lozenge.neutral { color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  .btn, .chips button, .tabs button, .team button { border:1px solid var(--line-strong); background:var(--surface); color:var(--fg); border-radius:var(--r2); padding:7px 12px; font:inherit; font-size:var(--fs-sm); cursor:pointer; }
  .chips button { border-radius:var(--pill); }
  .chips button[aria-pressed=true], .team button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .good { color:var(--ok); } .bad { color:var(--bad); }

  /* ---- catálogo */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--s3); }
  .games { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:var(--s3); }
  .game { display:flex; flex-direction:column; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:var(--s3) var(--s4); color:inherit; text-decoration:none; box-shadow:var(--shadow); }
  a.game:hover { border-color:var(--accent); }
  .game.off { opacity:.55; }
  .game .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:var(--s2); }
  .legend { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); align-items:center; font-size:var(--fs-sm); color:var(--muted); }

  /* ---- barra de contexto (jogo · versão · inicial · progresso), fixa no topo */
  .context { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); margin:0 calc(-1 * var(--s4)) var(--s4); padding:var(--s2) var(--s4); border-bottom:1px solid var(--line); }
  .context-row { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s3); align-items:center; }
  .context .back { color:var(--muted); text-decoration:none; font-size:var(--fs-sm); }
  .context h1 { font-size:var(--fs-lg); margin:0; }
  .context .field { display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--muted); }
  .context .field select { width:auto; padding:5px 8px; font-size:var(--fs-sm); }
  .spacer { flex:1; }
  details.about { margin:0 0 var(--s4); }
  details.about > summary { cursor:pointer; font-size:var(--fs-sm); color:var(--muted); }
  details.about .card { margin-top:var(--s2); font-size:var(--fs-sm); }

  /* ---- abas */
  .tabs { display:flex; gap:6px; margin:0 0 var(--s3); }
  .tabs button[aria-selected=true] { border-color:var(--accent); color:var(--accent); font-weight:600; }

  /* ---- oponente */
  .opp { display:flex; gap:var(--s3); align-items:center; }
  .opp img, .pick img, .starter img { width:64px; height:64px; image-rendering:pixelated; }
  .team { display:flex; flex-wrap:wrap; gap:6px; }
  details.filters > summary { cursor:pointer; font-size:var(--fs-sm); color:var(--muted); margin-top:var(--s3); }
  .checks { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:var(--s2); font-size:var(--fs-sm); }
  .checks label { display:flex; gap:6px; align-items:center; margin:0; color:var(--fg); font-size:var(--fs-sm); }
  .search-hint { float:right; }

  /* ---- resultados: cartões de comparação, veredito primeiro */
  .threat { margin:0 0 var(--s3); }
  .picks { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--s3); align-items:start; }
  .pick { margin:0; display:flex; flex-direction:column; gap:var(--s2); }
  .pick-head { display:flex; gap:var(--s3); align-items:center; }
  .pick-head h3 { margin:0; font-size:var(--fs-lg); }
  .rank { font-size:var(--fs-xs); color:var(--muted); font-weight:600; }
  .verdict { display:flex; flex-wrap:wrap; gap:6px; }
  .kv { font-size:var(--fs-sm); }
  .kv b { color:var(--muted); font-weight:600; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; display:block; }
  details.more > summary { cursor:pointer; font-size:var(--fs-sm); color:var(--link); }
  ul.why { margin:6px 0 0; padding-left:18px; font-size:var(--fs-sm); }

  /* ---- iniciais */
  .starters { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--s2); margin-top:var(--s2); }
  .starter { text-align:center; border:1px solid var(--line); border-radius:var(--r2); padding:var(--s2) 4px; background:var(--surface-2); }

  /* ---- detonado */
  details.stage { background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:10px 14px; margin-bottom:10px; }
  details.stage > summary { cursor:pointer; font-weight:600; }
  details.stage.current { border-color:var(--accent); }
  details.loc { border-top:1px solid var(--line); padding:6px 0; }
  details.loc > summary { cursor:pointer; }
  .walk-list { margin:4px 0 6px; padding-left:18px; font-size:var(--fs-sm); }
  .walk-h { font-size:var(--fs-xs); color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.04em; }

  /* ---- estados: esqueleto e vazio */
  .skel { background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size:200% 100%; animation:sh 1.2s infinite; border-radius:var(--r1); height:14px; margin:8px 0; }
  .skel.tall { height:120px; border-radius:var(--r3); }
  @keyframes sh { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation:none; } }
  .empty { text-align:center; color:var(--muted); padding:var(--s5) var(--s4); }

  @media (max-width:820px) { .picks { grid-template-columns:1fr; } }
  @media (max-width:520px) { .grid2 { grid-template-columns:1fr; } main { padding:var(--s3); } .context { margin:0 calc(-1 * var(--s3)) var(--s3); padding:var(--s2) var(--s3); } .search-hint { display:none; } }
</style>
</head>
<body>
<main>
 <section id="home" hidden>
  <h1>Poke Tact</h1>
  <p class="sub">Escolha o jogo que você está jogando. As sugestões usam só os Pokémon, golpes e regras daquele jogo.</p>
  <div class="card">
    <div class="label">Plataforma</div>
    <div class="chips" id="platformChips"></div>
    <div class="label">Geração</div>
    <div class="chips" id="genChips"></div>
    <div class="legend" id="qualityLegend"></div>
  </div>
  <p class="note" id="gameCount"></p>
  <div id="gameList"></div>
  <p class="note" id="catalogSources"></p>
 </section>

 <section id="tool" hidden>
  <div class="context" id="context">
    <div class="context-row">
      <a href="#/" class="back">← Jogos</a>
      <h1 id="gameTitle">Poke Tact</h1>
      <span id="qualityBadge"></span>
      <span class="spacer"></span>
      <span class="field"><label for="version" style="margin:0">Versão</label><select id="version"></select></span>
      <span class="field" id="starterWrap"><label for="starter" style="margin:0">Inicial</label><select id="starter"></select></span>
      <span class="field" id="stageWrap"><label for="stage" style="margin:0">Progresso</label><select id="stage"></select></span>
    </div>
  </div>

  <details class="about" id="about">
    <summary>Sobre os dados deste jogo</summary>
    <div class="card">
      <p id="gameInfo" style="margin-top:0">Carregando dados…</p>
      <p id="validationNote" hidden></p>
      <p id="walkthrough"></p>
      <p id="disclaimer" style="margin-bottom:0"></p>
    </div>
  </details>

  <div class="card" id="starters" hidden></div>
  <div class="tabs" role="tablist" aria-label="Seções">
    <button type="button" role="tab" id="tabRec" aria-selected="true" aria-controls="recView">Recomendação</button>
    <button type="button" role="tab" id="tabWalk" aria-selected="false" aria-controls="walk">Detonado</button>
  </div>
  <div id="walk" role="tabpanel" hidden></div>
  <div id="recView" role="tabpanel">
  <div class="card stack">
    <div id="trainerBox">
      <label for="trainer">Treinador do jogo <span class="meta">— usa o time e os golpes reais</span></label>
      <select id="trainer"><option value="">— escolher o Pokémon manualmente —</option></select>
    </div>
    <div id="team" class="team"></div>
    <div>
      <label for="opp">Pokémon que você está enfrentando <span class="search-hint meta">atalho <kbd>/</kbd></span></label>
      <input type="search" id="opp" list="mons" placeholder="Digite o nome — ex.: gyarados" autocomplete="off" spellcheck="false">
      <datalist id="mons"></datalist>
    </div>
    <div id="oppInfo"></div>
    <div class="grid2">
      <div><label for="level">Nível do seu time</label><input type="number" id="level" min="1" max="100" value="30"></div>
      <div><label for="oppLevel">Nível do oponente <span class="meta">(opcional)</span></label><input type="number" id="oppLevel" min="1" max="100" placeholder="sem nível: usa os tipos dele"></div>
    </div>
    <details class="filters" id="filters">
      <summary>Filtros</summary>
      <div class="checks">
        <label><input type="checkbox" id="onlyObtainable" checked> Só o que dá para obter na versão</label>
        <label><input type="checkbox" id="fullEvo"> Só evolução final</label>
        <label><input type="checkbox" id="legend"> Incluir lendários</label>
        <label><input type="checkbox" id="machines" checked> Usar golpes de TM/HM e tutor</label>
        <label><input type="checkbox" id="tradeEvos"> Incluir evoluções por troca (precisa de outro jogo)</label>
      </div>
    </details>
  </div>

  <div id="results"></div>
  </div>
 </section>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
